<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build the Celtics rotation — Pull Up Shoot</title>
<style>
  :root {
    --bg: #f6f5f0;

    --line: #dcdbd3;
    --line-strong: #b8b7ad;
    --green: #007a33;

    --gold: #ba9653;
    --cell-off: #eceae2;

  body { padding: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { font-size: 13px; color: var(--ink-2); margin: 0 0 16px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button {
    font: inherit; font-size: 13px; padding: 8px 12px; border-radius: 6px;
    border: 1px solid var(--line-strong); background: var(--panel); color: var(--ink); cursor: pointer;
  }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
  .grid { min-width: max-content; }
  .qpick { display:flex; gap:4px; margin-bottom:8px; }
  .qb { padding:5px 10px; font-size:12px; border-radius:6px; }
  .qb.active { background:var(--ink); color:#fff; border-color:var(--ink); }
  details.folder summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; }
  details.folder summary::-webkit-details-marker { display:none; }
  details.folder summary::before { content:"▸"; font-size:10px; transition: transform .15s; }
  details.folder[open] summary::before { transform: rotate(90deg); }
  details.folder .grp-tabs { margin-top:2px; }
  .k { font-size: 9px; }
  .row { display: flex; align-items: center; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row.bench-start { border-top: 2px solid var(--line-strong); }
  .hdr { border-bottom: 1px solid var(--line-strong); position: sticky; top: 0; background: var(--panel); z-index: 2; }
  .name { width: 112px; flex-shrink: 0; padding: 4px 6px; position: sticky; left: 0; background: var(--panel); z-index: 1; border-right: 1px solid var(--line); }
  .name input { width: 100%; font: inherit; font-size: 13px; padding: 4px 6px; border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--ink); }
  .name input:hover, .name input:focus { border-color: var(--line-strong); background: #fff; outline: none; }
  .cells { display: flex; }
  .q { width: calc(var(--cw) * 12); text-align: center; font-size: 12px; color: var(--ink-3); padding: 6px 0; border-right: 2px solid var(--line-strong); }
  .q:last-child { border-right: 0; }
  :root { --cw: 11px; }
  .c { width: var(--cw); height: 24px; border-right: 1px solid #fff; background: var(--cell-off); cursor: pointer; flex-shrink: 0; }
  .c.on { background: var(--green); }
  .c.qe { border-right: 2px solid var(--line-strong); }
  .tot { width: 56px; flex-shrink: 0; text-align: right; font-size: 12px; color: var(--ink-2); padding: 0 8px; font-variant-numeric: tabular-nums; }
  .del { width: 28px; flex-shrink: 0; text-align: center; color: var(--ink-3); cursor: pointer; font-size: 16px; user-select: none; }
  .del:hover { color: #b3261e; }
  .tabs { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:10px; align-items:flex-start; }
  .grp-l { font-size:11px; color:var(--ink-3); margin-bottom:5px; }
  .grp-tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .res { font-size:11px; opacity:.75; margin-left:4px; }
  .note { font-size:12px; color:var(--ink-2); margin:-4px 0 10px; display:none; }
  .tab { padding:6px 12px; border-radius:999px; border:1px solid var(--line-strong); background:var(--panel); font-size:13px; }
  .tab.active { background:var(--green); border-color:var(--green); color:#fff; }
  .typ { display:block; font-size:10px; color: var(--ink-3); line-height: 1; margin-top: 2px; }
  .tot { line-height: 1.1; }
  .row.cnt { background: #fbfaf6; border-bottom: 2px solid var(--line-strong); }
  .k { width: var(--cw); height: 18px; font-size: 9px; line-height: 18px; text-align: center; color: var(--ink-3); border-right: 1px solid #fff; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .k.part { color: #b3261e; font-weight: 600; }
  .k.full { color: var(--green); font-weight: 600; }
  .k.qe { border-right: 2px solid var(--line-strong); }

  .hint { font-size: 12px; color: var(--ink-3); margin-top: 10px; line-height: 1.5; }
  details { margin-top: 20px; }
  summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
  textarea { width: 100%; min-height: 140px; margin-top: 8px; font-family: monospace; font-size: 12px; padding: 8px; border: 1px solid var(--line); border-radius: 6px; }
  button:disabled { opacity:.45; cursor:default; }
  button.on { background: var(--green-soft); border-color: var(--green); }
  .wrap.paint .c { touch-action: none; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
  .modal[hidden] { display: none; }
  .modal-box { background: var(--panel); border-radius: 10px; padding: 12px; max-width: 96vw; max-height: 92vh; overflow: auto; }
  .modal-bar { display: flex; gap: 12px; align-items: center; font-size: 12px; color: var(--ink-2); margin-bottom: 10px; flex-wrap: wrap; }
  .modal-bar a { color: var(--green); font-weight: 600; text-decoration: none; }
  .modal-bar button { margin-left: auto; }
  #exportImg { max-width: 100%; height: auto; display: block; border: 1px solid var(--line); }
  @media (max-width: 640px) {
    body { padding: 12px; }
    h1 { font-size: 18px; }
    .name { width: 88px; }
    .name input { font-size: 12px; padding: 4px 2px; }
    .tot { width: 46px; font-size: 11px; padding: 0 4px; }
    .tot.avg { display: none; }
    .row.hdr .tot.avg { display: none; }
    .c { height: 28px; }
  }
  .foot { font-size: 11px; color: var(--ink-3); margin-top: 28px; }
  .msg { font-size: 12px; color: var(--ink-2); margin-top: 6px; }

</head>

<h1>Build the Celtics rotation</h1>
<p class="sub">Or see how Mazzulla ran it in Round 1 against Philly.</p>

<div id="gnote" class="note"></div>
<div class="bar">

</div>

<div class="qpick" id="qpick"></div>
<div class="wrap"><div class="grid" id="grid"></div></div>
<div id="bump"></div>
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div class="modal-bar"><span>Right-click or long-press the image to save it.</span><a id="dl" download="rotation-board.png" href="#">Download</a><button id="closeModal">Close</button></div>
    <img id="exportImg" alt="Rotation board export">
  </div>
</div>


<details>
  <summary>Add another game (paste play-by-play)</summary>
  <label style="font-size:12px;color:var(--ink-2);display:block;margin-top:8px;">Celtics roster for this game (comma separated, last names as they appear in the play-by-play)</label>
  <input id="roster" style="width:100%;font:inherit;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:6px;margin-top:4px;">
  <input id="gname" placeholder="Game label (e.g. Game 3 vs PHI)" style="width:100%;font:inherit;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:6px;margin-top:8px;">
  <textarea id="pbp" placeholder="Paste the raw play-by-play text here"></textarea>
  <div class="bar" style="margin-top:8px;">
    <button class="primary" id="parseBtn">Add this game</button>
  </div>
  <div class="msg" id="msg"></div>
</details>

function sampleStints(name){
  const out=[]; const seen=new Set();
  for (const g of GAMES){
    const st = g.stints[name] || (REF_EXTRA[name]||{})[g.name];
    if (st){ out.push({ st, blowout: !!g.blowout }); seen.add(g.name); }
  }
  for (const k in (REF_EXTRA[name]||{})){
    if (seen.has(k)) continue;
    const v = REF_EXTRA[name][k];
    out.push(Array.isArray(v) ? { st:v, blowout:false } : { st:v.st, blowout:!!v.blowout });
  }
  return out;
}

  if (REF[name]) return REF[name];

  for (const g of games) for (let m=0;m<48;m++){
    if (m>=36 && g.blowout) continue;
    n[m]++;
    if (g.st.some(([a,b])=>Math.min(b,(m+1)*60)-Math.max(a,m*60)>=30)) on[m]++;

let customCount = 0;

function renderTabs(){
  const t=document.getElementById('tabs');
  const series = state.map((g,i)=>[g,i]).filter(([g])=>!g.plan && !g.added);
  const added  = state.map((g,i)=>[g,i]).filter(([g])=>g.added);
  const plans  = state.map((g,i)=>[g,i]).filter(([g])=>g.plan);
  const btn = ([g,i]) => '<button class="tab'+(i===cur?' active':'')+'" data-g="'+i+'">'+g.name+(g.result?' <span class="res">'+g.result+'</span>':'')+'</button>';
  const curSeries = series.find(([g,i])=>i===cur);
  const sumLabel = 'Last season: Round 1 vs Philadelphia' + (curSeries ? ' · viewing '+curSeries[0].name : ' · '+series.length+' games');
  t.innerHTML = '<div class="grp"><div class="grp-l">Build your own</div><div class="grp-tabs">'+plans.map(btn).join('')+'</div></div>'
              + '<details class="grp folder"'+(seriesOpen?' open':'')+'><summary class="grp-l">'+sumLabel+'</summary><div class="grp-tabs">'+series.map(btn).join('')+'</div></details>'
              + (added.length ? '<div class="grp"><div class="grp-l">Added games</div><div class="grp-tabs">'+added.map(btn).join('')+'</div></div>' : '');
  t.querySelector('details.folder').addEventListener('toggle', e=>{ seriesOpen = e.target.open; });
  document.getElementById('refBtn').style.display = state[cur].plan ? '' : 'none';
  const n=document.getElementById('gnote'); n.textContent = state[cur].note || ''; n.style.display = state[cur].note ? 'block' : 'none';
  t.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{ cur=+b.dataset.g; players=state[cur].players; painting=null; renderTabs(); render(); }));
}

let lastCell = null;
function render(){
  const g = document.getElementById('grid');
  const isPlan = !!state[cur].plan;
  const [m0,m1] = viewRange();
  const ncol = m1-m0;
  const wrapW = document.querySelector('.wrap').clientWidth || 640;
  const cw = view==='all' ? Math.max(6, Math.min(14, Math.floor((wrapW-112-56-56-28)/TOTAL_MIN))) : Math.max(14, Math.floor((wrapW-112-56-56-28)/12));
  document.documentElement.style.setProperty('--cw', cw+'px');
  const qp=document.getElementById('qpick');
  qp.innerHTML = ['all',0,1,2,3].map(v=>'<button class="qb'+(v===view?' active':'')+'" data-v="'+v+'">'+(v==='all'?'All':'Q'+(v+1))+'</button>').join('');
  qp.querySelectorAll('.qb').forEach(b=>b.addEventListener('click',()=>{ const v=b.dataset.v; view = v==='all'?'all':+v; render(); }));
  let html = '<div class="row hdr"><div class="name"></div><div class="cells">';
  if (view==='all'){ for (let q=1;q<=4;q++) html += '<div class="q">Q'+q+'</div>'; }
  else html += '<div class="q" style="width:'+(12*cw)+'px">Q'+(view+1)+'</div>';
  html += '</div><div class="tot">Min</div><div class="del"></div></div>';
  if (isPlan){
    let used=0;
    html += '<div class="row cnt"><div class="name" style="font-size:11px;color:var(--ink-3);">On floor</div><div class="cells">';
    for (let i=0;i<TOTAL_MIN;i++){
      const c = floorCount(players,i); used+=c;
      if (i>=m0 && i<m1) html += '<div class="k'+(c===5?' full':c>0?' part':'')+(((i+1)%12===0)?' qe':'')+'">'+c+'</div>';
    }
    html += '</div><div class="tot" style="font-weight:600;">'+used+'/240</div><div class="del"></div></div>';
  }
  players.forEach((p,r)=>{
    const firstBench = !p.starter && r>0 && players[r-1].starter;
    html += '<div class="row'+(firstBench?' bench-start':'')+'"><div class="name"><input value="'+p.name.replace(/"/g,'&quot;')+'" data-r="'+r+'"></div><div class="cells">';
    const ref = (isPlan && showRef) ? refFreq(p.name) : null;
    for (let i=m0;i<m1;i++){
      const st = (ref && !p.minutes[i] && ref.f[i]>0) ? ' style="background:'+shade(ref.f[i])+'"' : '';
      html += '<div class="c'+(p.minutes[i]?' on':'')+(((i+1)%12===0)?' qe':'')+'" data-r="'+r+'" data-m="'+i+'"'+st+'></div>';
    }
    const typ = (isPlan && showRef) ? (()=>{ const rf=refFreq(p.name); return rf ? '<span class="typ">'+Math.round(rf.typ)+' typ</span>' : '<span class="typ">—</span>'; })() : '';
    html += '</div><div class="tot">'+totalLabel(p)+typ+'</div><div class="del" data-del="'+r+'" title="Remove row">×</div></div>';
  });
  g.innerHTML = html;
  document.getElementById('undoBtn').disabled = !(state[cur].undo && state[cur].undo.length);
  persist();

  g.querySelectorAll('.c').forEach(c=>c.addEventListener('click',(e)=>{
    if (paint) return;
    snapshot();
    const r=+c.dataset.r, m=+c.dataset.m;
    let targets=[m];
    if (e.shiftKey && lastCell && lastCell.r===r){
      const a=Math.min(lastCell.m,m), b=Math.max(lastCell.m,m);
      targets=[]; for(let i=a;i<=b;i++) targets.push(i);
    }
    const turningOn = !players[r].minutes[m];
    let blocked=false;
    for (const t of targets){
      if (turningOn){
        if (isPlan && !players[r].minutes[t] && floorCount(players,t)>=5){ blocked=true; continue; }
        players[r].minutes[t]=true;
      } else players[r].minutes[t]=false;
    }
    players[r].edited = true;
    lastCell={r,m};
    render();
    if (blocked){ const b=document.getElementById('bump'); b.textContent='Five players are already on the floor in that minute. Take someone off first.'; b.style.opacity=1; clearTimeout(b._t); b._t=setTimeout(()=>b.style.opacity=0,2200); }
  }));
  g.querySelectorAll('.name input').forEach(i=>i.addEventListener('change',()=>{ snapshot(); players[+i.dataset.r].name = i.value; persist(); }));
  g.querySelectorAll('.del').forEach(d=>{
    if (d.dataset.del===undefined) return;
    d.addEventListener('click',()=>{ snapshot(); players.splice(+d.dataset.del,1); render(); });
  });
}

document.getElementById('addBtn').addEventListener('click',()=>{
  snapshot();
  customCount++;
  players.push({ name:'New player '+customCount, minutes:new Array(TOTAL_MIN).fill(false), exact:null, edited:true });
  render();
});
document.getElementById('resetBtn').addEventListener('click',()=>{
  snapshot();
  if (state[cur].plan){ state[cur].players = PLAN_ROSTER.map(n=>({ name:n, minutes:new Array(TOTAL_MIN).fill(false), exact:null, edited:true, starter:false })); }
  else state[cur].players = fromStints(state[cur].stints);
  players = state[cur].players; render();
});

/* ---------- play-by-play parser ---------- */
const STOP = '(?:\\d|Free Throw|Jump Ball|Bad Pass|Lost Ball|Out Of|Offensive|Traveling|Violation|S\\.FOUL|P\\.FOUL|T\\.FOUL|L\\.B\\.FOUL|OFF\\.Foul|Turnover|REBOUND|STEAL|BLOCK)';
const NAME_RE = new RegExp("^([A-Za-z.\\-' ]+?)\\s+(?="+STOP+")");
function leadingName(l){ const m=NAME_RE.exec(l); return m?m[1].trim():null; }

function parseQuarters(text){
  const lines = text.split('\n').map(l=>l.trim());
  let quarter=1, clockSec=720; const events=[];
  for (const line of lines){
    if (!line) continue;
    if (/^(undefined Headshot|Logo)$/.test(line)) continue;
    if (/^Instant Replay/i.test(line)) continue;
    let m;
    if ((m=/^(\d{1,2}):(\d{2})$/.exec(line))){ clockSec=+m[1]*60+ +m[2]; continue; }
    if (/^\d+\s*-\s*\d+$/.test(line)) continue;
    if (/^Q\d\s*END$/i.test(line)) continue;
    if ((m=/^Q(\d)\s*START$/i.exec(line))){ quarter=+m[1]; clockSec=720; continue; }
    if (/^Q\d$/i.test(line)) continue;
    events.push({ q:quarter, elapsed:(quarter-1)*720+(720-clockSec), raw:line });
  }
  return events;
}

function buildCeltics(text, rosterStr){
  const roster = rosterStr.split(',').map(x=>x.trim()).filter(Boolean);
  if (!roster.length) throw new Error('Enter the Celtics roster first.');
  const isC = n => roster.some(r=>r.toLowerCase()===n.toLowerCase());
  const events = parseQuarters(text);
  if (!events.length) throw new Error('No events found. Check the paste.');
  const nQ = Math.max(...events.map(e=>e.q));
  const stints = {};
  for (let q=1;q<=nQ;q++){
    const qEvents = events.filter(e=>e.q===q);
    const qStart=(q-1)*720, qEnd=q*720;
    const first={};
    const subs=[];
    for (const ev of qEvents){
      let m;
      if ((m=/^SUB:\s*(.+?)\s+FOR\s+(.+)$/i.exec(ev.raw))){
        const pin=m[1].trim(), pout=m[2].trim();
        subs.push({e:ev.elapsed,pin,pout});
        if(!first[pout]) first[pout]='out';
        if(!first[pin]) first[pin]='in';
        continue;
      }
      if (/^(\S+)\s+(Rebound|Timeout|Turnover|Violation)\b/.test(ev.raw)) continue;
      const jb=/^Jump Ball\s+(.+?)\s+Vs\.\s+(.+?):\s*Tip To\s+(.+)$/i.exec(ev.raw);
      if (jb){ for (const n of [jb[1],jb[2],jb[3]]) if(!first[n.trim()]) first[n.trim()]='action'; continue; }
      const name=leadingName(ev.raw.replace(/^MISS\s+/,''));
      if (name && !first[name]) first[name]='action';
      const am=/\(([A-Za-z.\-' ]+?)\s+\d+\s*AST\)/.exec(ev.raw);
      if (am){ const a=am[1].trim(); if(!first[a]) first[a]='action'; }
    }
    const open={};
    for (const p in first) if (isC(p) && first[p]!=='in') open[p]=qStart;
    for (const s of subs){
      if (!isC(s.pin) && !isC(s.pout)) continue;
      if (open[s.pout]!==undefined){ (stints[s.pout]=stints[s.pout]||[]).push([open[s.pout],s.e]); delete open[s.pout]; }
      if (isC(s.pin)) open[s.pin]=s.e;
    }
    for (const p in open) (stints[p]=stints[p]||[]).push([open[p],qEnd]);
  }
  if (!Object.keys(stints).length) throw new Error('Parsed the game but none of the roster names were found.');
  return stints;
}

document.getElementById('parseBtn').addEventListener('click',()=>{
  const msg=document.getElementById('msg');
  try {
    const st=buildCeltics(document.getElementById('pbp').value, document.getElementById('roster').value);
    const nm = (document.getElementById('gname').value.trim()) || ('Game '+(state.length+1));
    state.push({ name:nm, players:fromStints(st), stints:st, added:true });
    cur=state.length-1; players=state[cur].players; customCount=0;
    renderTabs(); render();
    msg.className='msg'; msg.textContent='Added '+nm+' with '+players.length+' Celtics players.';
    document.getElementById('pbp').value=''; document.getElementById('gname').value='';
  } catch(e){ msg.className='msg err'; msg.textContent=e.message; }
});

document.getElementById('undoBtn').addEventListener('click', undo);

const paintBtn=document.getElementById('paintBtn');
paintBtn.addEventListener('click',()=>{
  paint=!paint;
  paintBtn.textContent='Paint mode: '+(paint?'on':'off');
  paintBtn.classList.toggle('on',paint);
  document.querySelector('.wrap').classList.toggle('paint',paint);
});
function paintCell(el, val){
  const r=+el.dataset.r, m=+el.dataset.m;
  if (players[r].minutes[m]===val) return;
  if (val && state[cur].plan && floorCount(players,m)>=5) return;
  players[r].minutes[m]=val; players[r].edited=true;
  el.classList.toggle('on',val);
}
const wrapEl=document.querySelector('.wrap');
wrapEl.addEventListener('pointerdown',e=>{
  if (!paint) return;
  const el=e.target.closest('.c'); if(!el) return;
  e.preventDefault();
  snapshot();
  painting={ r:+el.dataset.r, val: !players[+el.dataset.r].minutes[+el.dataset.m] };
  paintCell(el, painting.val);
  try{ wrapEl.setPointerCapture(e.pointerId); }catch(_){}
});
wrapEl.addEventListener('pointermove',e=>{
  if (!painting) return;
  const el=document.elementFromPoint(e.clientX,e.clientY);
  if (el && el.classList.contains('c') && +el.dataset.r===painting.r) paintCell(el, painting.val);
});
const endPaint=()=>{ if(!painting) return; painting=null; render(); };
wrapEl.addEventListener('pointerup',endPaint);
wrapEl.addEventListener('pointercancel',endPaint);

function exportImage(){
  const g=state[cur], isPlan=!!g.plan;
  const rows=players;
  const S=2, nameW=150, cellW=16, cellH=24, totW=70, pad=24, headH=isPlan?96:70;
  const W=pad*2+nameW+TOTAL_MIN*cellW+totW, H=headH+rows.length*cellH+pad+40;
  const cv=document.createElement('canvas'); cv.width=W*S; cv.height=H*S;
  const x=cv.getContext('2d'); x.scale(S,S);
  x.fillStyle='#ffffff'; x.fillRect(0,0,W,H);
  x.fillStyle='#1c1c1a'; x.font='600 18px Helvetica Neue, Helvetica, Arial, sans-serif';
  const title = isPlan ? g.name : 'Celtics rotation, '+g.name+(g.result?' ('+g.result+')':'');
  x.fillText(title, pad, pad+6);
  x.font='12px Helvetica Neue, Helvetica, Arial, sans-serif'; x.fillStyle='#5e5e58';
  x.fillText(isPlan && showRef ? 'Green = drawn. Shade = how often that player was on the floor in that minute last spring.' : 'One cell = one minute. Green = on the floor.', pad, pad+26);
  const gx=pad+nameW, gy=headH;
  x.font='11px Helvetica Neue, Helvetica, Arial, sans-serif'; x.textAlign='center';
  for (let q=0;q<4;q++){ x.fillStyle='#9a9a92'; x.fillText('Q'+(q+1), gx+q*12*cellW+6*cellW, gy-8); }
  if (isPlan){
    for (let i=0;i<TOTAL_MIN;i++){ const c=floorCount(rows,i); x.fillStyle=c===5?'#007a33':c>0?'#b3261e':'#9a9a92'; x.fillText(c, gx+i*cellW+cellW/2, gy-24); }
    x.textAlign='left'; x.fillStyle='#5e5e58'; x.fillText('On floor', pad, gy-24);
  }
  x.textAlign='left';
  rows.forEach((p,r)=>{
    const y=gy+r*cellH;
    x.fillStyle='#1c1c1a'; x.font=(p.starter?'600 ':'')+'13px Helvetica Neue, Helvetica, Arial, sans-serif';
    x.fillText(p.name, pad, y+16);
    const ref=(isPlan && showRef) ? refFreq(p.name) : null;
    for (let i=0;i<TOTAL_MIN;i++){
      x.fillStyle=p.minutes[i]?'#007a33':(ref && ref.f[i]>0 ? shade(ref.f[i]) : '#eceae2');
      x.fillRect(gx+i*cellW, y+2, cellW-1, cellH-4);
    }
    x.fillStyle='#5e5e58'; x.font='12px Helvetica Neue, Helvetica, Arial, sans-serif'; x.textAlign='right';
    x.fillText(totalLabel(p), gx+TOTAL_MIN*cellW+totW-4, y+16); x.textAlign='left';
  });
  x.strokeStyle='#b8b7ad'; x.lineWidth=1.5;
  for (let q=1;q<4;q++){ const qx=gx+q*12*cellW-0.5; x.beginPath(); x.moveTo(qx,gy-4); x.lineTo(qx,gy+rows.length*cellH); x.stroke(); }
  x.fillStyle='#9a9a92'; x.font='11px Helvetica Neue, Helvetica, Arial, sans-serif';
  x.fillText('Pull Up Shoot · Celtics rotation board', pad, H-14);
  const url=cv.toDataURL('image/png');
  document.getElementById('exportImg').src=url;
  const dl=document.getElementById('dl'); dl.href=url; dl.download=(isPlan?'rotation-plan':'rotation-'+g.name.toLowerCase())+'.png';
  document.getElementById('modal').hidden=false;
}
document.getElementById('exportBtn').addEventListener('click', exportImage);
const refBtn=document.getElementById('refBtn');
refBtn.addEventListener('click',()=>{ showRef=!showRef; refBtn.textContent='Reference: '+(showRef?'on':'off'); refBtn.classList.toggle('on',showRef); render(); });
document.getElementById('closeModal').addEventListener('click', ()=>{ document.getElementById('modal').hidden=true; });
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') e.target.hidden=true; });

document.getElementById('roster').value = DEFAULT_ROSTER;
renderTabs();
render();
window.addEventListener('resize', ()=>{ clearTimeout(window._rt); window._rt=setTimeout(render,150); });
</script>
